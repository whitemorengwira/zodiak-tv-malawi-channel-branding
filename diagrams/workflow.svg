<svg viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" style="background:#0a1128;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <marker id="wfArrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#D4AF37"/>
    </marker>
  </defs>

  <rect x="30" y="20" width="840" height="50" rx="0" fill="#12182e" stroke="#D4AF37" stroke-width="1"/>
  <text x="50" y="44" fill="#D4AF37" font-size="13" font-weight="700" letter-spacing="1">END-TO-END PRODUCTION PIPELINE MODEL</text>
  <text x="50" y="60" fill="#94A3B8" font-size="10">ZODIAK TV · Engineered Media Delivery Workflow</text>

  <!-- Stage Row 1 -->
  <g transform="translate(30, 95)">
    <!-- 01 Pre-Production -->
    <rect x="0" y="0" width="150" height="75" fill="#161d36" stroke="#475569" stroke-width="1"/>
    <text x="12" y="20" fill="#D4AF37" font-size="9" font-weight="700">STAGE 01</text>
    <text x="12" y="38" fill="#F8FAFC" font-size="11" font-weight="600">PRE-PRODUCTION</text>
    <text x="12" y="55" fill="#94A3B8" font-size="9">Script &amp; Technical Specs</text>
    <line x1="150" y1="37" x2="170" y2="37" stroke="#D4AF37" stroke-width="1.5" marker-end="url(#wfArrow)"/>

    <!-- 02 Capture -->
    <rect x="175" y="0" width="150" height="75" fill="#161d36" stroke="#475569" stroke-width="1"/>
    <text x="187" y="20" fill="#D4AF37" font-size="9" font-weight="700">STAGE 02</text>
    <text x="187" y="38" fill="#F8FAFC" font-size="11" font-weight="600">CAPTURE / SHOOT</text>
    <text x="187" y="55" fill="#94A3B8" font-size="9">Camera Media &amp; Audio</text>
    <line x1="325" y1="37" x2="345" y2="37" stroke="#D4AF37" stroke-width="1.5" marker-end="url(#wfArrow)"/>

    <!-- 03 Ingest & S3 -->
    <rect x="350" y="0" width="150" height="75" fill="#161d36" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="362" y="20" fill="#38BDF8" font-size="9" font-weight="700">STAGE 03</text>
    <text x="362" y="38" fill="#F8FAFC" font-size="11" font-weight="600">INGEST &amp; CLOUD</text>
    <text x="362" y="55" fill="#94A3B8" font-size="9">S3 Upload + Checksum</text>
    <line x1="500" y1="37" x2="520" y2="37" stroke="#D4AF37" stroke-width="1.5" marker-end="url(#wfArrow)"/>

    <!-- 04 Auto Transcode -->
    <rect x="525" y="0" width="150" height="75" fill="#161d36" stroke="#A855F7" stroke-width="1.5"/>
    <text x="537" y="20" fill="#A855F7" font-size="9" font-weight="700">STAGE 04</text>
    <text x="537" y="38" fill="#F8FAFC" font-size="11" font-weight="600">AUTOMATION / AI</text>
    <text x="537" y="55" fill="#94A3B8" font-size="9">Lambda Proxies &amp; QC</text>
    <line x1="675" y1="37" x2="695" y2="37" stroke="#D4AF37" stroke-width="1.5" marker-end="url(#wfArrow)"/>

    <!-- 05 Editorial -->
    <rect x="700" y="0" width="140" height="75" fill="#161d36" stroke="#475569" stroke-width="1"/>
    <text x="712" y="20" fill="#D4AF37" font-size="9" font-weight="700">STAGE 05</text>
    <text x="712" y="38" fill="#F8FAFC" font-size="11" font-weight="600">EDITORIAL CUT</text>
    <text x="712" y="55" fill="#94A3B8" font-size="9">Offline Edit &amp; Story</text>
  </g>

  <!-- Connecting Path between Row 1 and Row 2 -->
  <path d="M 770 170 L 770 200 L 70 200 L 70 215" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Stage Row 2 -->
  <g transform="translate(30, 220)">
    <!-- 06 Colour & DI -->
    <rect x="0" y="0" width="150" height="75" fill="#161d36" stroke="#D4AF37" stroke-width="1.5"/>
    <text x="12" y="20" fill="#D4AF37" font-size="9" font-weight="700">STAGE 06</text>
    <text x="12" y="38" fill="#F8FAFC" font-size="11" font-weight="600">COLOUR &amp; DI</text>
    <text x="12" y="55" fill="#94A3B8" font-size="9">DaVinci Resolve Finishing</text>
    <line x1="150" y1="37" x2="170" y2="37" stroke="#D4AF37" stroke-width="1.5" marker-end="url(#wfArrow)"/>

    <!-- 07 Sound & Graphics -->
    <rect x="175" y="0" width="150" height="75" fill="#161d36" stroke="#475569" stroke-width="1"/>
    <text x="187" y="20" fill="#D4AF37" font-size="9" font-weight="700">STAGE 07</text>
    <text x="187" y="38" fill="#F8FAFC" font-size="11" font-weight="600">SOUND &amp; TITLES</text>
    <text x="187" y="55" fill="#94A3B8" font-size="9">5.1 / Stereo Stems &amp; Motion</text>
    <line x1="325" y1="37" x2="345" y2="37" stroke="#D4AF37" stroke-width="1.5" marker-end="url(#wfArrow)"/>

    <!-- 08 Technical QC -->
    <rect x="350" y="0" width="150" height="75" fill="#161d36" stroke="#34D399" stroke-width="1.5"/>
    <text x="362" y="20" fill="#34D399" font-size="9" font-weight="700">STAGE 08</text>
    <text x="362" y="38" fill="#F8FAFC" font-size="11" font-weight="600">TECHNICAL QC</text>
    <text x="362" y="55" fill="#94A3B8" font-size="9">EBU R128 &amp; Gamut Gate</text>
    <line x1="500" y1="37" x2="520" y2="37" stroke="#D4AF37" stroke-width="1.5" marker-end="url(#wfArrow)"/>

    <!-- 09 Mastering & Delivery -->
    <rect x="525" y="0" width="150" height="75" fill="#161d36" stroke="#F43F5E" stroke-width="1.5"/>
    <text x="537" y="20" fill="#F43F5E" font-size="9" font-weight="700">STAGE 09</text>
    <text x="537" y="38" fill="#F8FAFC" font-size="11" font-weight="600">DELIVERY</text>
    <text x="537" y="55" fill="#94A3B8" font-size="9">Network Transmission Master</text>
    <line x1="675" y1="37" x2="695" y2="37" stroke="#D4AF37" stroke-width="1.5" marker-end="url(#wfArrow)"/>

    <!-- 10 Long-Term Archive -->
    <rect x="700" y="0" width="140" height="75" fill="#161d36" stroke="#38BDF8" stroke-width="1"/>
    <text x="712" y="20" fill="#38BDF8" font-size="9" font-weight="700">STAGE 10</text>
    <text x="712" y="38" fill="#F8FAFC" font-size="11" font-weight="600">ARCHIVE</text>
    <text x="712" y="55" fill="#94A3B8" font-size="9">S3 Glacier Deep Vault</text>
  </g>
</svg>